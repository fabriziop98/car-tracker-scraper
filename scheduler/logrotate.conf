# Rotacion de batch.log (incidente 2026-08-31: llego a 4,86 GB sin techo).
#
# Bajar el ruido de botocore en settings.py ataca la causa de ESTE caso; la
# rotacion es la red de seguridad para el proximo: cualquier libreria que se
# ponga charlatana vuelve a llenar el disco igual, y un log sin techo es un
# incidente esperando.
/app/logs/batch.log {
	daily
	rotate 7
	maxsize 200M
	compress
	delaycompress
	missingok
	notifempty
	# copytruncate y no create: el redirect del cron (`>> batch.log`) mantiene
	# el fd abierto mientras una corrida esta en curso. Con la rotacion normal
	# (renombrar + crear uno nuevo) esa corrida seguiria escribiendo al inodo
	# viejo ya renombrado y sus lineas se perderian del archivo activo.
	copytruncate
}
